jobs:
  test:
    runs-on: node:24
    steps:
      - name: Checkout code
        use: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Authorize with AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push to AWS ECR
        run: | 
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 523213418935.dkr.ecr.eu-central-1.amazonaws.com
          docker build -t 523213418935.dkr.ecr.eu-central-1.amazonaws.com/dot-bot:dot-bot-image .
          docker push 523213418935.dkr.ecr.eu-central-1.amazonaws.com/dot-bot:dot-bot-image

      